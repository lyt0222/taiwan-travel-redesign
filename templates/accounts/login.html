{% extends "base.html" %}
{% block title %}會員登入｜臺灣觀光資訊網{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>會員登入</h1>
  <p class="lead">登入後可以把景點加入「我的行程」，記錄預計出遊日與備註。</p>
  {% if form.errors %}
    <p class="msg msg-error" role="alert">帳號或密碼不正確，請再試一次。</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="id_username">帳號</label>
      {{ form.username }}
    </div>
    <div class="field">
      <label for="id_password">密碼</label>
      <div class="password-field">
        {{ form.password }}
        <button class="password-toggle" type="button" data-target="id_password" aria-label="顯示密碼" aria-pressed="false">顯示</button>
      </div>
    </div>
    <button class="btn btn-primary btn-block" type="submit">登入</button>
  </form>
  <p class="hint">還沒有帳號？<a href="{% url 'accounts:register' %}">免費註冊</a>｜測試帳號：<code>demo</code></p>
</div>
{% endblock %}
